name: lint

on:
  push:
    branches: [main]
  pull_request:

# ドキュメント・コメントの規約から外れたものを検出する。
#
# 人手で5言語ぶんを揃え続けるのは必ず破綻するので、ここで機械的に守る
# （docs/adr/0009-static-api-extraction.md）。
jobs:
  check:
    name: ドキュメントとコメントの規約
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ソースの静的解析だけで済むので、言語のツールチェーンは要らない
      - name: 公開APIとドキュメントを突き合わせる
        run: python3 spec/tools/check_docs_sync.py

      - name: ドキュメント内のリンク切れを調べる
        run: python3 spec/tools/check_links.py

      # 「if / ループにコメントを入れる」は独自の規約なので、
      # 各言語の標準 Linter には該当ルールが無い。自前で見るしかない
      - name: コメントと禁止記法の規約適合を調べる
        run: python3 spec/tools/check_comments.py
