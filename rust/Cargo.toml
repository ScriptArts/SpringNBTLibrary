[package]
name = "spring-nbt-library"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Minecraft Java Edition の NBT / Anvil ワールドデータを読み書きするライブラリ"
repository = "https://github.com/scriptarts/SpringNBTLibrary"
readme = "README.md"
keywords = ["minecraft", "nbt", "anvil", "mca"]
categories = ["encoding", "game-development"]

[lib]
name = "spring_nbt_library"
path = "src/lib.rs"

[dependencies]
flate2 = "1.0"

# LZ4（圧縮ID 4）は v0.1.0 では未実装。生バイトでのみ取り出せる。
# 実装するときに lz4_flex を任意依存として足す（docs/features.md）

[dev-dependencies]
serde_json = "1.0"
